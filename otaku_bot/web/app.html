<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🎌 أوتاكو</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#f4f6fb; --fg:#1b2130; --muted:#6b7280; --card:#ffffff; --accent:#3b82f6; --ok:#16a34a; --bad:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171f; --fg:#eef1f6; --muted:#9aa3b2; --card:#1e2330; --line:#2b3242; } }
  :root[data-theme="dark"] { --bg:#14171f; --fg:#eef1f6; --muted:#9aa3b2; --card:#1e2330; --line:#2b3242; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; padding-bottom:72px; }
  header { padding:14px 16px 6px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  main { padding:8px 14px; max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:20px; }
  .stat span { color:var(--muted); font-size:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child { border-bottom:0; }
  .muted { color:var(--muted); font-size:13px; }
  a.btn, button.btn { display:block; text-align:center; text-decoration:none; border:0; border-radius:12px; padding:12px; font-size:15px; font-weight:600; background:var(--accent); color:#fff; cursor:pointer; margin:6px 0; }
  button.btn.ok { background:var(--ok); } button.btn.ghost { background:#94a3b8; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); }
  nav button { flex:1; border:0; background:none; padding:10px 0 12px; color:var(--muted); font-size:12px; cursor:pointer; }
  nav button.on { color:var(--accent); font-weight:700; }
  nav button .i { display:block; font-size:20px; margin-bottom:2px; }
  .toggle { position:relative; width:48px; height:28px; background:#94a3b8; border-radius:20px; border:0; cursor:pointer; }
  .toggle.on { background:var(--ok); }
  .toggle::after { content:""; position:absolute; top:3px; right:3px; width:22px; height:22px; background:#fff; border-radius:50%; transition:.2s; }
  .toggle.on::after { right:23px; }
  .tab { display:none; } .tab.on { display:block; }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; background:var(--line); }
  #msg { text-align:center; color:var(--ok); min-height:20px; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1 id="hello">🎌 أوتاكو</h1>
  <p id="sub">جارٍ التحميل…</p>
</header>
<main>
  <section class="tab on" id="t-home">
    <div class="grid" id="home-stats"></div>
    <div class="card"><b>🎮 ابدأ لعبة</b><div id="home-games"></div></div>
    <div class="card"><b>♟ شطرنجك</b><div id="home-chess" class="muted">—</div></div>
  </section>

  <section class="tab" id="t-profile">
    <div class="card">
      <div id="p-title" style="font-size:18px;font-weight:700"></div>
      <div class="muted" id="p-level"></div>
    </div>
    <div class="grid" id="p-stats"></div>
    <div class="card"><b>🎮 نتائجك في الألعاب</b><div id="p-games"></div></div>
    <div class="card"><b>📈 آخر نتائجك</b><div id="p-recent" class="muted"></div></div>
  </section>

  <section class="tab" id="t-chess">
    <div class="card"><b>♟ مبارياتك</b><div id="c-list"></div></div>
    <div class="muted">لبدء تحدٍّ جديد، اكتب /chess في أي محادثة أو مجموعة.</div>
  </section>

  <section class="tab" id="t-rank">
    <div class="card"><b>🏆 المتصدرون</b><div id="r-list"></div></div>
    <div class="muted" id="r-me"></div>
  </section>

  <section class="tab" id="t-settings">
    <div class="card">
      <div class="row"><span>اللغة</span><button class="btn ghost" id="lang" style="width:auto;margin:0;padding:8px 14px">English</button></div>
      <div class="row"><span>إخفاء اسمي من الترتيب</span><button class="toggle" id="hide"></button></div>
      <div class="row"><span>إشعارات الألعاب الجماعية</span><button class="toggle" id="notify"></button></div>
    </div>
    <div id="msg"></div>
  </section>
</main>

<nav>
  <button data-t="home" class="on"><span class="i">🏠</span>الرئيسية</button>
  <button data-t="profile"><span class="i">👤</span>ملفي</button>
  <button data-t="chess"><span class="i">♟</span>الشطرنج</button>
  <button data-t="rank"><span class="i">🏆</span>الترتيب</button>
  <button data-t="settings"><span class="i">⚙️</span>الإعدادات</button>
</nav>

<script>
(function () {
  var tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); }
  var initData = tg ? tg.initData : "";
  var me = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function api(path, body) {
    return fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "X-Init-Data": initData, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, data: j }; }); });
  }
  function open(link) {
    if (!link) return;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, "_blank");
  }
  function say(t) { $("msg").textContent = t || ""; setTimeout(function () { $("msg").textContent = ""; }, 2200); }

  // التبويبات
  document.querySelectorAll("nav button").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll("nav button").forEach(function (x) { x.classList.remove("on"); });
      document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on"); $("t-" + b.dataset.t).classList.add("on");
      if (b.dataset.t === "rank") loadTop();
    };
  });

  var GAMES_AR = {}, GAMES_EN = {};
  function gameName(g) { return me && me.lang === "en" ? g.en : g.ar; }
  var ENDS = { win: "🏆 فوز", lose: "😵 خسارة", draw: "🤝 تعادل" };

  function renderMe() {
    var en = me.lang === "en";
    $("hello").textContent = (en ? "Hi, " : "أهلاً، ") + me.name + " 👋";
    $("sub").textContent = me.title ? me.title : (en ? "Play your first game!" : "ابدأ أول لعبة!");
    $("home-stats").innerHTML =
      stat(me.best || "—", en ? "Best score" : "أفضل نتيجة") +
      stat(me.tests, en ? "Quizzes" : "اختبارات") +
      stat(me.rank ? "#" + me.rank : "—", en ? "Rank" : "ترتيبك") +
      stat(me.achievements + "/" + me.achievements_total, en ? "Achievements" : "إنجازات");
    $("p-title").textContent = me.title || (en ? "No title yet" : "بدون لقب بعد");
    $("p-level").textContent = (en ? "Level " : "المستوى ") + me.level + " · " + me.xp + " XP";
    var acc = me.answers ? Math.round(100 * me.correct / me.answers) + "%" : "—";
    $("p-stats").innerHTML =
      stat(me.best || "—", en ? "Best" : "أفضل") + stat(me.tests, en ? "Quizzes" : "اختبارات") +
      stat(acc, en ? "Accuracy" : "الدقة") + stat(me.weekly_rank ? "#" + me.weekly_rank : "—", en ? "Weekly" : "الأسبوع");
    var gs = me.games || {}, keys = Object.keys(gs);
    $("p-games").innerHTML = keys.length ? keys.map(function (k) {
      var s = gs[k], g = (GAMES_AR[k] || { ar: k, en: k });
      return '<div class="row"><span>' + esc(en ? g.en : g.ar) + '</span><span class="muted">' +
        ENDS.win + " " + (s.win || 0) + " · " + ENDS.lose + " " + (s.lose || 0) + " · " + ENDS.draw + " " + (s.draw || 0) + "</span></div>";
    }).join("") : '<div class="muted">' + (en ? "No games yet." : "ما لعبت بعد.") + "</div>";
    $("p-recent").textContent = me.recent.length ? me.recent.join(" · ") : (en ? "No quizzes yet." : "ما فيه اختبارات بعد.");
    $("home-chess").innerHTML = me.chess.length ? me.chess.slice(0, 3).map(chessRow).join("") :
      '<div class="muted">' + (en ? "No chess games yet." : "ما عندك مباريات شطرنج بعد.") + "</div>";
    $("c-list").innerHTML = me.chess.length ? me.chess.map(chessRow).join("") :
      '<div class="muted">' + (en ? "No games yet." : "ما عندك مباريات بعد.") + "</div>";
    $("lang").textContent = en ? "العربية" : "English";
    $("hide").classList.toggle("on", !!me.lb_hidden);
    $("notify").classList.toggle("on", !!me.notify);
    $("r-me").textContent = me.rank ? (en ? "Your rank: #" + me.rank : "ترتيبك: #" + me.rank) : "";
    document.documentElement.lang = en ? "en" : "ar";
    document.documentElement.dir = en ? "ltr" : "rtl";
  }
  function stat(v, label) { return '<div class="stat"><b>' + esc(v) + "</b><span>" + esc(label) + "</span></div>"; }
  function chessRow(c) {
    var res = c.state === "done" ? (c.result === "draw" ? "🤝" : (c.result === c.color ? "🏆" : "😵")) : "♟";
    var label = c.state === "wait" ? "بانتظار خصم" : (c.state === "play" ? "جارية" : "انتهت");
    return '<div class="row"><span>' + res + " ضد " + esc(c.opponent) + '</span><span class="muted">' + label + "</span></div>";
  }

  function loadGames() {
    api("/api/app/games").then(function (r) {
      var list = r.data.games || [];
      list.forEach(function (g) { GAMES_AR[g.key] = g; GAMES_EN[g.key] = g; });
      var en = me && me.lang === "en";
      $("home-games").innerHTML = list.filter(function (g) { return r.data.enabled[g.key] !== false; }).map(function (g) {
        return '<button class="btn" data-link="' + esc(g.link) + '">' + esc(en ? g.en : g.ar) + "</button>";
      }).join("");
      document.querySelectorAll("#home-games button").forEach(function (b) { b.onclick = function () { open(b.dataset.link); }; });
    });
  }

  function loadTop() {
    api("/api/app/top").then(function (r) {
      var rows = r.data.rows || [];
      $("r-list").innerHTML = rows.length ? rows.map(function (x, i) {
        return '<div class="row"><span>' + (i + 1) + ". " + esc(x.name) + '</span><span class="pill">⭐ ' + x.score + "</span></div>";
      }).join("") : '<div class="muted">—</div>';
    });
  }

  function saveSettings(body, okText) {
    api("/api/app/settings", body).then(function (r) {
      if (r.ok) { say(okText); refresh(); } else say("تعذّر الحفظ، جرّب مرة ثانية");
    });
  }
  $("lang").onclick = function () { saveSettings({ lang: me.lang === "en" ? "ar" : "en" }, "✅"); };
  $("hide").onclick = function () { saveSettings({ lb_hidden: !me.lb_hidden }, "✅"); };
  $("notify").onclick = function () { saveSettings({ notify: !me.notify }, "✅"); };

  function refresh() {
    api("/api/app/me").then(function (r) {
      if (!r.ok) { $("sub").textContent = "افتح التطبيق من تيليجرام"; return; }
      me = r.data; renderMe();
    });
  }

  refresh();
  loadGames();
})();
</script>
</body>
</html>
